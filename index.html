<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Tracker</title>

  <!-- Leaflet: the map library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100%; }
    #status {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(20, 24, 33, .9); color: #fff;
      padding: 8px 12px; border-radius: 8px; font-size: 13px;
    }
    .plane svg { width: 26px; height: 26px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Loading…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ---------- 1. Set up the map ----------
    // The two numbers are latitude and longitude. Change them to look elsewhere.
    const map = L.map("map").setView([42.55, -71.76], 8);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const statusEl = document.getElementById("status");
    const markers = new Map();   // remembers one marker per plane
    let pauseUntil = 0;          // used if OpenSky says "slow down"

    // ---------- 2. Draw a plane icon ----------
    // Color depends on altitude: gray = on ground, yellow = low, green = mid, blue = high
    function planeIcon(heading, altitudeM, onGround) {
      const color = onGround ? "#9aa0a6"
        : altitudeM < 3000 ? "#f4b400"
        : altitudeM < 8000 ? "#34a853"
        : "#4285f4";
      const svg = `
        <svg viewBox="0 0 24 24" style="transform: rotate(${heading}deg)">
          <path fill="${color}" stroke="#111" stroke-width="0.6"
            d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
        </svg>`;
      return L.divIcon({ html: svg, className: "plane", iconSize: [26, 26], iconAnchor: [13, 13] });
    }

    // ---------- 3. The text shown when you click a plane ----------
    function popupHtml(f) {
      const feet = f.altitudeM != null ? Math.round(f.altitudeM * 3.28084).toLocaleString() + " ft" : "n/a";
      const knots = f.speedMs != null ? Math.round(f.speedMs * 1.94384) + " kt" : "n/a";
      return `
        <strong>${f.callsign || "Unknown"}</strong><br>
        Country: ${f.country}<br>
        Altitude: ${feet}<br>
        Speed: ${knots}<br>
        Heading: ${Math.round(f.heading)}°`;
    }

    // ---------- 4. Get planes and put them on the map ----------
    async function refresh() {
      if (Date.now() < pauseUntil) return;

      // Ask only for planes inside the part of the map you can see
      const b = map.getBounds();
      const params = new URLSearchParams({
        lamin: b.getSouth().toFixed(2), lomin: b.getWest().toFixed(2),
        lamax: b.getNorth().toFixed(2), lomax: b.getEast().toFixed(2),
      });

      try {
        const res = await fetch("https://opensky-network.org/api/states/all?" + params);

        if (res.status === 429) {            // "too many requests"
          pauseUntil = Date.now() + 60000;   // wait one minute
          statusEl.textContent = "Rate limited, pausing for 60s…";
          return;
        }
        if (!res.ok) throw new Error("Bad response");

        const data = await res.json();

        // OpenSky sends each plane as a list of numbers. Turn it into a readable object.
        const flights = (data.states || [])
          .filter(s => s[5] !== null && s[6] !== null)   // skip planes with no position
          .map(s => ({
            id: s[0],
            callsign: (s[1] || "").trim(),
            country: s[2],
            lon: s[5],
            lat: s[6],
            altitudeM: s[7],
            onGround: s[8],
            speedMs: s[9],
            heading: s[10] ?? 0,
          }));

        const stillHere = new Set();

        for (const f of flights) {
          stillHere.add(f.id);
          const icon = planeIcon(f.heading, f.altitudeM ?? 0, f.onGround);
          const existing = markers.get(f.id);

          if (existing) {
            // Plane already on the map: just move it
            existing.setLatLng([f.lat, f.lon]);
            existing.setIcon(icon);
            existing.setPopupContent(popupHtml(f));
          } else {
            // New plane: add it
            const m = L.marker([f.lat, f.lon], { icon }).addTo(map).bindPopup(popupHtml(f));
            markers.set(f.id, m);
          }
        }

        // Remove planes that are gone
        for (const [id, m] of markers) {
          if (!stillHere.has(id)) { map.removeLayer(m); markers.delete(id); }
        }

        statusEl.textContent = `${flights.length} aircraft · updated ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        statusEl.textContent = "Data unavailable, retrying…";
      }
    }

    // ---------- 5. Keep it updating ----------
    refresh();                          // once right away
    setInterval(refresh, 15000);        // then every 15 seconds

    // Also refresh after the user drags or zooms, but wait until they stop
    let timer;
    map.on("moveend", () => {
      clearTimeout(timer);
      timer = setTimeout(refresh, 1000);
    });
  </script>
</body>
</html>
