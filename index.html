<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Tracker</title>

  <!-- Leaflet: the map library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #111; }
    #map { height: 100%; background: #111; }

    /* Turn the normal map into a dark map by inverting its colors */
    .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    /* Panels floating over the map */
    .panel {
      position: absolute; z-index: 1000;
      background: rgba(20, 24, 33, .92); color: #fff;
      padding: 8px 12px; border-radius: 8px; font-size: 13px;
    }
    #status { top: 10px; right: 10px; }
    #search { top: 10px; left: 60px; display: flex; gap: 6px; align-items: center; }
    #search input[type="text"] {
      width: 190px; padding: 5px 8px; border-radius: 6px;
      border: 1px solid #3c4352; background: #0d1017; color: #fff; font-size: 13px;
    }
    #search button {
      padding: 5px 10px; border-radius: 6px; border: 0;
      background: #4285f4; color: #fff; font-size: 13px; cursor: pointer;
    }
    #search label { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }

    .plane svg { width: 26px; height: 26px; filter: drop-shadow(0 0 2px rgba(0,0,0,.8)); }

    /* Keep the narrow-screen layout from overlapping */
    @media (max-width: 600px) {
      #search { left: 60px; right: 10px; flex-wrap: wrap; }
      #status { top: auto; bottom: 24px; right: 10px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Search box + airports toggle -->
  <div id="search" class="panel">
    <input id="searchInput" type="text" placeholder="Callsign, reg, or airport" list="callsigns" autocomplete="off" />
    <datalist id="callsigns"></datalist>
    <button id="searchBtn">Find</button>
    <label title="Shows airports with weather reports when zoomed in"><input id="airportToggle" type="checkbox" checked /> Airports</label>
  </div>

  <div id="status" class="panel">Loading…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ---------- 1. Set up the map (dark style) ----------
    // The two numbers are latitude and longitude. Change them to look elsewhere.
    const map = L.map("map").setView([42.55, -71.76], 8);

    // Normal OpenStreetMap tiles; the CSS filter above turns them dark
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const statusEl = document.getElementById("status");
    const searchInput = document.getElementById("searchInput");
    const datalist = document.getElementById("callsigns");

    const markers = new Map();   // one marker per plane
    const planes = new Map();    // latest data for each plane (used by search)
    let pauseUntil = 0;          // used if the data service says "slow down"

    // ---------- 2. Draw a plane icon ----------
    // Color depends on altitude: gray = on ground, yellow = low, green = mid, blue = high
    function planeIcon(heading, altitudeM, onGround) {
      const color = onGround ? "#9aa0a6"
        : altitudeM < 3000 ? "#f4b400"
        : altitudeM < 8000 ? "#34a853"
        : "#4285f4";
      const svg = `
        <svg viewBox="0 0 24 24" style="transform: rotate(${heading}deg)">
          <path fill="${color}" stroke="#fff" stroke-width="0.5"
            d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
        </svg>`;
      return L.divIcon({ html: svg, className: "plane", iconSize: [26, 26], iconAnchor: [13, 13] });
    }

    // ---------- 3. The text shown when you click a plane ----------
    function popupHtml(f) {
      const feet = f.onGround ? "On ground" : Math.round(f.altitudeM * 3.28084).toLocaleString() + " ft";
      const knots = f.speedMs != null ? Math.round(f.speedMs * 1.94384) + " kt" : "n/a";
      return `
        <strong>${f.callsign || "Unknown"}</strong><br>
        Registration: ${f.reg}<br>
        Aircraft type: ${f.type}<br>
        ICAO hex: ${f.id}<br>
        Altitude: ${feet}<br>
        Speed: ${knots}<br>
        Heading: ${Math.round(f.heading)}°`;
    }

    // ---------- 4. Flight path (shown when you click a plane) ----------
    // The history comes from adsb.lol's recorded flight traces, fetched through your Worker.
    const pathLayer = L.layerGroup().addTo(map);
    let selectedId = null;       // the plane whose path is showing
    let pathLine = null;         // the line drawn on the map
    let basePoints = [];         // recorded history from the departure point
    let livePoints = [];         // positions collected while you watch (keeps the line current)
    let pathToken = 0;           // used to ignore out-of-date downloads

    function drawPath() {
      const pts = basePoints.concat(livePoints);
      if (pathLine) pathLine.setLatLngs(pts);
    }

    function clearSelection() {
      selectedId = null;
      pathToken++;               // cancels any download still in progress
      pathLayer.clearLayers();
      pathLine = null;
      basePoints = [];
      livePoints = [];
    }

    async function selectPlane(id) {
      clearSelection();
      selectedId = id;
      const token = pathToken;

      // Start with a line right away (just the plane's current spot)
      pathLine = L.polyline([], { color: "#ffd54f", weight: 3, opacity: 0.9 });
      pathLayer.addLayer(pathLine);
      const f = planes.get(id);
      if (f) livePoints.push([f.lat, f.lon]);
      drawPath();

      try {
        const res = await fetch(`${WORKER}/trace/${id}`);
        if (!res.ok) throw new Error("No history for this aircraft");
        const data = await res.json();
        if (token !== pathToken) return;   // you clicked something else meanwhile

        const trace = data.trace || [];
        // Each entry is [seconds after start, lat, lon, altitude, speed, heading, flags, ...].
        // A flag of 2 marks the start of a new flight, so find the most recent one.
        let start = 0;
        for (let i = trace.length - 1; i >= 0; i--) {
          if (((trace[i][6] || 0) & 2) !== 0) { start = i; break; }
        }
        const leg = trace.slice(start).filter(p => typeof p[1] === "number" && typeof p[2] === "number");
        if (!leg.length) return;

        basePoints = leg.map(p => [p[1], p[2]]);
        livePoints = livePoints.slice(-1);  // the history already covers everything before now
        drawPath();

        // Mark where the flight began
        const first = leg[0];
        const onGround = first[3] === "ground";
        const when = data.timestamp != null
          ? new Date((data.timestamp + first[0]) * 1000)
              .toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
          : "";
        const label = onGround
          ? `Departed${when ? " " + when : ""}`
          : "Earliest recorded point";
        pathLayer.addLayer(
          L.circleMarker([first[1], first[2]], {
            radius: 6, color: "#fff", weight: 2, fillColor: "#34a853", fillOpacity: 1,
          }).bindTooltip(label, { permanent: true, direction: "top", offset: [0, -6] })
        );
      } catch (err) {
        console.error(err);   // no history available: the line just follows the plane from now on
      }
    }

    // ---------- 5. Search ----------
    // Fly to a plane and open its popup
    function goToPlane(f) {
      map.flyTo([f.lat, f.lon], Math.max(map.getZoom(), 9));
      const m = markers.get(f.id);
      if (m) m.openPopup();
    }

    // Fly to an airport that is already on the map and open its popup
    function goToLoadedAirport(a) {
      map.flyTo([a.lat, a.lon], Math.max(map.getZoom(), 10));
      const marker = airports.get(a.id);
      if (marker) marker.openPopup();
    }

    async function doSearch() {
      const q = searchInput.value.trim().toUpperCase();
      if (!q) return;

      const planeList = [...planes.values()];
      const airportList = [...airportData.values()];

      // 1. Exact plane match (callsign or registration)
      let plane = planeList.find(f => f.callsign.toUpperCase() === q || f.reg.toUpperCase() === q);
      if (plane) return goToPlane(plane);

      // 2. Exact airport code match among airports already loaded
      let airport = airportList.find(a => a.id.toUpperCase() === q);
      if (airport) return goToLoadedAirport(airport);

      // 3. Partial plane match
      plane = planeList.find(f => f.callsign.toUpperCase().includes(q) || f.reg.toUpperCase().includes(q));
      if (plane) return goToPlane(plane);

      // 4. Partial airport match (code or name) among airports already loaded
      airport = airportList.find(a => a.id.toUpperCase().includes(q) || a.name.toUpperCase().includes(q));
      if (airport) return goToLoadedAirport(airport);

      // 5. Look the airport up anywhere in the world by its code (e.g. KFIT, or just FIT for US airports)
      if (/^[A-Z0-9]{3,4}$/.test(q)) {
        statusEl.textContent = `Looking up ${q}…`;
        const codes = q.length === 3 ? ["K" + q, q] : [q];
        for (const code of codes) {
          try {
            const res = await fetch(`${WORKER}/metar?ids=${code}`);
            if (res.status === 204 || !res.ok) continue;
            const list = await res.json();
            if (list && list.length && list[0].lat != null) {
              const a = list[0];
              airportToggle.checked = true;
              pendingAirportPopup = a.icaoId;       // open its popup once it loads
              map.flyTo([a.lat, a.lon], 11);
              return;
            }
          } catch (err) {
            console.error(err);
          }
        }
      }

      statusEl.textContent = `Nothing found for "${q}". Try a callsign, registration, or airport code like KFIT.`;
    }

    document.getElementById("searchBtn").addEventListener("click", doSearch);
    searchInput.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

    // ---------- 6. Smooth movement ----------
    // Between data updates, each plane keeps gliding in the direction it's flying
    // at its current speed. When fresh data arrives, the plane eases to the
    // corrected position instead of jumping.
    const motion = new Map();   // plane id -> movement info

    function velocity(f) {
      if (f.onGround || f.speedMs == null || f.speedMs < 2) return { vLat: 0, vLon: 0 };
      const h = f.heading * Math.PI / 180;
      return {
        vLat: f.speedMs * Math.cos(h) / 111320,                                   // degrees per second
        vLon: f.speedMs * Math.sin(h) / (111320 * Math.cos(f.lat * Math.PI / 180)),
      };
    }

    // Only redraw a plane's icon when its look actually changes (saves a lot of work)
    function iconKey(f) {
      const band = f.onGround ? "g" : f.altitudeM < 3000 ? "l" : f.altitudeM < 8000 ? "m" : "h";
      return Math.round(f.heading / 3) + band;
    }

    let lastFrame = 0;
    function animate(ts) {
      requestAnimationFrame(animate);
      if (document.hidden || ts - lastFrame < 66) return;   // about 15 frames per second
      lastFrame = ts;

      for (const [id, st] of motion) {
        const m = markers.get(id);
        if (!m) continue;
        const dt = Math.max(0, Math.min(ts - st.t, 30000)) / 1000;  // seconds since last update
        const k = Math.max(0, 1 - dt / 2);                          // correction fades out over 2s
        m.setLatLng([
          st.lat + st.vLat * dt + st.offLat * k,
          st.lon + st.vLon * dt + st.offLon * k,
        ]);
      }
    }
    requestAnimationFrame(animate);

    // ---------- 7. Get planes and put them on the map ----------
    async function refresh() {
      if (Date.now() < pauseUntil || document.hidden) return;

      // Center of the visible map, and the distance to its corner (= radius)
      const center = map.getCenter();
      const corner = map.getBounds().getNorthEast();
      const radiusNm = Math.min(250, Math.ceil(map.distance(center, corner) / 1852));

      const url = `https://flight-proxy.ericdoorman1027.workers.dev/${center.lat.toFixed(3)}/${center.lng.toFixed(3)}/${radiusNm}`;

      try {
        const res = await fetch(url);

        if (res.status === 429) {            // "too many requests"
          pauseUntil = Date.now() + 60000;   // wait one minute
          statusEl.textContent = "Rate limited, pausing for 60s…";
          return;
        }
        if (!res.ok) throw new Error("Bad response");

        const data = await res.json();

        // Convert adsb.lol's format into the fields the rest of the code uses
        const flights = (data.ac || [])
          .filter(a => a.lat != null && a.lon != null)
          .map(a => {
            const onGround = a.alt_baro === "ground";
            return {
              id: a.hex,
              callsign: (a.flight || "").trim(),
              reg: a.r || "n/a",
              type: a.t || "n/a",
              lat: a.lat,
              lon: a.lon,
              altitudeM: onGround || a.alt_baro == null ? 0 : a.alt_baro * 0.3048, // feet to meters
              onGround,
              speedMs: a.gs != null ? a.gs / 1.94384 : null,                        // knots to m/s
              heading: a.track ?? 0,
            };
          });

        const stillHere = new Set();
        planes.clear();

        for (const f of flights) {
          stillHere.add(f.id);
          planes.set(f.id, f);

          // Keep the selected plane's path growing while you watch it
          if (f.id === selectedId) {
            const last = livePoints[livePoints.length - 1];
            if (!last || last[0] !== f.lat || last[1] !== f.lon) {
              livePoints.push([f.lat, f.lon]);
              drawPath();
            }
          }

          const now = performance.now();
          const v = velocity(f);
          const key = iconKey(f);
          const existing = markers.get(f.id);
          const st = motion.get(f.id);

          if (existing && st) {
            // Plane already on the map: remember where it is drawn right now,
            // so it can ease toward the corrected position instead of jumping
            const cur = existing.getLatLng();
            st.offLat = cur.lat - f.lat;
            st.offLon = cur.lng - f.lon;
            st.lat = f.lat; st.lon = f.lon; st.t = now;
            st.vLat = v.vLat; st.vLon = v.vLon;

            if (st.iconKey !== key) {
              existing.setIcon(planeIcon(f.heading, f.altitudeM, f.onGround));
              st.iconKey = key;
            }
            existing.setPopupContent(popupHtml(f));
          } else {
            // New plane: add it
            const icon = planeIcon(f.heading, f.altitudeM, f.onGround);
            const m = L.marker([f.lat, f.lon], { icon }).addTo(map).bindPopup(popupHtml(f));
            m.on("popupopen", () => selectPlane(f.id));
            m.on("popupclose", () => { if (selectedId === f.id) clearSelection(); });
            markers.set(f.id, m);
            motion.set(f.id, {
              lat: f.lat, lon: f.lon, t: now,
              vLat: v.vLat, vLon: v.vLon,
              offLat: 0, offLon: 0, iconKey: key,
            });
          }
        }

        // Remove planes that are gone
        for (const [id, m] of markers) {
          if (!stillHere.has(id)) {
            map.removeLayer(m);
            markers.delete(id);
            motion.delete(id);
          }
        }

        // Refresh the search suggestions
        const names = [...new Set(flights.map(f => f.callsign).filter(Boolean))].sort().slice(0, 300);
        datalist.innerHTML = names.map(n => `<option value="${n}"></option>`).join("");

        statusEl.textContent = `${flights.length} aircraft · updated ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Data unavailable, retrying…";
      }
    }

    // ---------- 7. Airports and their weather ----------
    // Weather comes from aviationweather.gov (official METAR reports),
    // fetched through your Cloudflare Worker.
    const WORKER = "https://flight-proxy.ericdoorman1027.workers.dev";
    const airportToggle = document.getElementById("airportToggle");
    const airportLayer = L.layerGroup().addTo(map);
    const airports = new Map();       // airport code -> map marker
    const airportData = new Map();    // airport code -> { id, name, lat, lon } (used by search)
    let pendingAirportPopup = null;   // airport to open a popup for once it appears
    const MIN_AIRPORT_ZOOM = 7;       // airports only show when zoomed in this far

    // Flight category colors: green = VFR, blue = MVFR, red = IFR, purple = LIFR
    const CAT_COLORS = { VFR: "#34a853", MVFR: "#4285f4", IFR: "#ea4335", LIFR: "#c026d3" };

    // Make text safe to put inside HTML
    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function windText(m) {
      if (m.wspd == null) return "n/a";
      if (m.wspd === 0) return "Calm";
      const dir = (m.wdir == null || m.wdir === "VRB") ? "Variable" : String(m.wdir).padStart(3, "0") + "°";
      return `${dir} at ${m.wspd} kt` + (m.wgst ? `, gusting ${m.wgst} kt` : "");
    }

    function cloudText(m) {
      if (!m.clouds || !m.clouds.length) return "n/a";
      return m.clouds
        .map(c => c.base != null ? `${c.cover} ${Number(c.base).toLocaleString()} ft` : c.cover)
        .join(", ");
    }

    function tempText(c) {
      if (c == null) return "n/a";
      return `${c}°C (${Math.round(c * 9 / 5 + 32)}°F)`;
    }

    function altimText(a) {
      if (a == null) return "n/a";
      const inHg = a > 100 ? a * 0.02953 : a;   // the service reports hectopascals
      return inHg.toFixed(2) + " inHg";
    }

    function airportPopup(m) {
      const cat = m.fltCat || "n/a";
      const color = CAT_COLORS[cat] || "#888";
      const time = m.obsTime
        ? new Date(m.obsTime * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
        : "n/a";
      return `
        <strong>${esc(m.icaoId)}</strong> · ${esc(m.name || "")}<br>
        <span style="color:${color}; font-weight:600;">${esc(cat)}</span>
        <small>(observed ${esc(time)})</small><br>
        Wind: ${esc(windText(m))}<br>
        Visibility: ${m.visib != null ? esc(m.visib) + " mi" : "n/a"}<br>
        Clouds: ${esc(cloudText(m))}<br>
        Temp / Dew point: ${esc(tempText(m.temp))} / ${esc(tempText(m.dewp))}<br>
        Altimeter: ${esc(altimText(m.altim))}<br>
        <small style="font-family:monospace;">${esc(m.rawOb || "")}</small>`;
    }

    function clearAirports() {
      airportLayer.clearLayers();
      airports.clear();
      airportData.clear();
    }

    async function loadAirports() {
      if (!airportToggle.checked || map.getZoom() < MIN_AIRPORT_ZOOM) {
        clearAirports();
        return;
      }

      const b = map.getBounds();
      const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()]
        .map(v => v.toFixed(2)).join(",");

      try {
        const res = await fetch(`${WORKER}/metar?bbox=${bbox}`);
        let stations = [];
        if (res.status !== 204) {                 // 204 means "no airports here"
          if (!res.ok) throw new Error("Weather request failed");
          stations = await res.json();
        }

        const seen = new Set();
        for (const m of stations) {
          if (m.lat == null || m.lon == null || !m.icaoId) continue;
          seen.add(m.icaoId);
          const color = CAT_COLORS[m.fltCat] || "#9aa0a6";
          const existing = airports.get(m.icaoId);

          if (existing) {
            existing.setStyle({ fillColor: color });
            existing.setPopupContent(airportPopup(m));
          } else {
            const marker = L.circleMarker([m.lat, m.lon], {
              radius: 7, color: "#fff", weight: 1.5, fillColor: color, fillOpacity: 0.95,
            })
              .bindPopup(airportPopup(m))
              .bindTooltip(m.icaoId);
            airportLayer.addLayer(marker);
            airports.set(m.icaoId, marker);
          }
          airportData.set(m.icaoId, { id: m.icaoId, name: m.name || "", lat: m.lat, lon: m.lon });
        }

        // Remove airports that are no longer in view
        for (const [id, marker] of airports) {
          if (!seen.has(id)) {
            airportLayer.removeLayer(marker);
            airports.delete(id);
            airportData.delete(id);
          }
        }

        // If the user searched for an airport, open its popup now that it's on the map
        if (pendingAirportPopup && airports.has(pendingAirportPopup)) {
          airports.get(pendingAirportPopup).openPopup();
          pendingAirportPopup = null;
        }
      } catch (err) {
        console.error(err);   // airports are optional, so fail quietly
      }
    }

    airportToggle.addEventListener("change", loadAirports);

    // ---------- 8. Keep it updating ----------
    refresh();                          // planes: once right away
    setInterval(refresh, 5000);         // then every 5 seconds
    loadAirports();                     // airports: once right away
    setInterval(loadAirports, 300000);  // then every 5 minutes (weather changes slowly)

    // Also refresh after the user drags or zooms, but wait until they stop
    let timer;
    map.on("moveend", () => {
      clearTimeout(timer);
      timer = setTimeout(() => { refresh(); loadAirports(); }, 500);
    });
  </script>
</body>
</html>
