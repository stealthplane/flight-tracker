<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Tracker</title>

  <!-- Leaflet: the map library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #111; }
    #map { height: 100%; background: #111; }

    /* Panels floating over the map */
    .panel {
      position: absolute; z-index: 1000;
      background: rgba(20, 24, 33, .92); color: #fff;
      padding: 8px 12px; border-radius: 8px; font-size: 13px;
    }
    #status { top: 10px; right: 10px; }
    #search { top: 10px; left: 60px; display: flex; gap: 6px; align-items: center; }
    #search input[type="text"] {
      width: 150px; padding: 5px 8px; border-radius: 6px;
      border: 1px solid #3c4352; background: #0d1017; color: #fff; font-size: 13px;
    }
    #search button {
      padding: 5px 10px; border-radius: 6px; border: 0;
      background: #4285f4; color: #fff; font-size: 13px; cursor: pointer;
    }
    #search label { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }

    .plane svg { width: 26px; height: 26px; filter: drop-shadow(0 0 2px rgba(0,0,0,.8)); }

    /* Keep the narrow-screen layout from overlapping */
    @media (max-width: 600px) {
      #search { left: 60px; right: 10px; flex-wrap: wrap; }
      #status { top: auto; bottom: 24px; right: 10px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Search box + trails toggle -->
  <div id="search" class="panel">
    <input id="searchInput" type="text" placeholder="Callsign or reg" list="callsigns" autocomplete="off" />
    <datalist id="callsigns"></datalist>
    <button id="searchBtn">Find</button>
    <label><input id="trailToggle" type="checkbox" checked /> Trails</label>
  </div>

  <div id="status" class="panel">Loading…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ---------- 1. Set up the map (dark style) ----------
    // The two numbers are latitude and longitude. Change them to look elsewhere.
    const map = L.map("map").setView([42.55, -71.76], 8);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd",
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
    }).addTo(map);

    const statusEl = document.getElementById("status");
    const searchInput = document.getElementById("searchInput");
    const datalist = document.getElementById("callsigns");
    const trailToggle = document.getElementById("trailToggle");

    const markers = new Map();   // one marker per plane
    const planes = new Map();    // latest data for each plane (used by search)
    const trails = new Map();    // one trail per plane: { points: [...], line: polyline }
    const trailLayer = L.layerGroup().addTo(map);
    const MAX_TRAIL_POINTS = 40; // about 10 minutes of history at 15s updates
    let pauseUntil = 0;          // used if the data service says "slow down"

    // ---------- 2. Draw a plane icon ----------
    // Color depends on altitude: gray = on ground, yellow = low, green = mid, blue = high
    function planeIcon(heading, altitudeM, onGround) {
      const color = onGround ? "#9aa0a6"
        : altitudeM < 3000 ? "#f4b400"
        : altitudeM < 8000 ? "#34a853"
        : "#4285f4";
      const svg = `
        <svg viewBox="0 0 24 24" style="transform: rotate(${heading}deg)">
          <path fill="${color}" stroke="#fff" stroke-width="0.5"
            d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
        </svg>`;
      return L.divIcon({ html: svg, className: "plane", iconSize: [26, 26], iconAnchor: [13, 13] });
    }

    // ---------- 3. The text shown when you click a plane ----------
    function popupHtml(f) {
      const feet = f.onGround ? "On ground" : Math.round(f.altitudeM * 3.28084).toLocaleString() + " ft";
      const knots = f.speedMs != null ? Math.round(f.speedMs * 1.94384) + " kt" : "n/a";
      return `
        <strong>${f.callsign || "Unknown"}</strong><br>
        Registration: ${f.reg}<br>
        Aircraft type: ${f.type}<br>
        Altitude: ${feet}<br>
        Speed: ${knots}<br>
        Heading: ${Math.round(f.heading)}°`;
    }

    // ---------- 4. Trails ----------
    function updateTrail(f) {
      let t = trails.get(f.id);
      if (!t) {
        const line = L.polyline([], { color: "#8ab4f8", weight: 2, opacity: 0.7 });
        trailLayer.addLayer(line);
        t = { points: [], line };
        trails.set(f.id, t);
      }
      const last = t.points[t.points.length - 1];
      // Only add a point if the plane actually moved
      if (!last || last[0] !== f.lat || last[1] !== f.lon) {
        t.points.push([f.lat, f.lon]);
        if (t.points.length > MAX_TRAIL_POINTS) t.points.shift();
        t.line.setLatLngs(t.points);
      }
    }

    trailToggle.addEventListener("change", () => {
      if (trailToggle.checked) map.addLayer(trailLayer);
      else map.removeLayer(trailLayer);
    });

    // ---------- 5. Search ----------
    function doSearch() {
      const q = searchInput.value.trim().toUpperCase();
      if (!q) return;

      let found = null;
      // First look for an exact match on callsign or registration...
      for (const f of planes.values()) {
        if (f.callsign.toUpperCase() === q || f.reg.toUpperCase() === q) { found = f; break; }
      }
      // ...then for a partial match
      if (!found) {
        for (const f of planes.values()) {
          if (f.callsign.toUpperCase().includes(q) || f.reg.toUpperCase().includes(q)) { found = f; break; }
        }
      }

      if (found) {
        map.flyTo([found.lat, found.lon], Math.max(map.getZoom(), 9));
        const m = markers.get(found.id);
        if (m) m.openPopup();
      } else {
        statusEl.textContent = `No aircraft matching "${q}" in the current map area`;
      }
    }

    document.getElementById("searchBtn").addEventListener("click", doSearch);
    searchInput.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

    // ---------- 6. Get planes and put them on the map ----------
    async function refresh() {
      if (Date.now() < pauseUntil) return;

      // Center of the visible map, and the distance to its corner (= radius)
      const center = map.getCenter();
      const corner = map.getBounds().getNorthEast();
      const radiusNm = Math.min(250, Math.ceil(map.distance(center, corner) / 1852));

      const url = `https://flight-proxy.ericdoorman1027.workers.dev/${center.lat.toFixed(3)}/${center.lng.toFixed(3)}/${radiusNm}`;

      try {
        const res = await fetch(url);

        if (res.status === 429) {            // "too many requests"
          pauseUntil = Date.now() + 60000;   // wait one minute
          statusEl.textContent = "Rate limited, pausing for 60s…";
          return;
        }
        if (!res.ok) throw new Error("Bad response");

        const data = await res.json();

        // Convert adsb.lol's format into the fields the rest of the code uses
        const flights = (data.ac || [])
          .filter(a => a.lat != null && a.lon != null)
          .map(a => {
            const onGround = a.alt_baro === "ground";
            return {
              id: a.hex,
              callsign: (a.flight || "").trim(),
              reg: a.r || "n/a",
              type: a.t || "n/a",
              lat: a.lat,
              lon: a.lon,
              altitudeM: onGround || a.alt_baro == null ? 0 : a.alt_baro * 0.3048, // feet to meters
              onGround,
              speedMs: a.gs != null ? a.gs / 1.94384 : null,                        // knots to m/s
              heading: a.track ?? 0,
            };
          });

        const stillHere = new Set();
        planes.clear();

        for (const f of flights) {
          stillHere.add(f.id);
          planes.set(f.id, f);
          updateTrail(f);

          const icon = planeIcon(f.heading, f.altitudeM, f.onGround);
          const existing = markers.get(f.id);

          if (existing) {
            // Plane already on the map: just move it
            existing.setLatLng([f.lat, f.lon]);
            existing.setIcon(icon);
            existing.setPopupContent(popupHtml(f));
          } else {
            // New plane: add it
            const m = L.marker([f.lat, f.lon], { icon }).addTo(map).bindPopup(popupHtml(f));
            markers.set(f.id, m);
          }
        }

        // Remove planes (and their trails) that are gone
        for (const [id, m] of markers) {
          if (!stillHere.has(id)) {
            map.removeLayer(m);
            markers.delete(id);
            const t = trails.get(id);
            if (t) { trailLayer.removeLayer(t.line); trails.delete(id); }
          }
        }

        // Refresh the search suggestions
        const names = [...new Set(flights.map(f => f.callsign).filter(Boolean))].sort().slice(0, 300);
        datalist.innerHTML = names.map(n => `<option value="${n}"></option>`).join("");

        statusEl.textContent = `${flights.length} aircraft · updated ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Data unavailable, retrying…";
      }
    }

    // ---------- 7. Keep it updating ----------
    refresh();                          // once right away
    setInterval(refresh, 15000);        // then every 15 seconds

    // Also refresh after the user drags or zooms, but wait until they stop
    let timer;
    map.on("moveend", () => {
      clearTimeout(timer);
      timer = setTimeout(refresh, 1000);
    });
  </script>
</body>
</html>
